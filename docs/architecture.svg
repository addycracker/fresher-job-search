<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040" role="img" aria-labelledby="title desc">
<title id="title">FresherJobs AI system architecture</title><desc id="desc">Scheduled Fargate ingestion collects public ATS postings into MongoDB. The Next.js frontend on Vercel calls a read-only NestJS API on Render over HTTPS with hybrid RSA AES encrypted job requests and responses.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#75628f"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#29243a}.title{font-size:34px;font-weight:700}.subtitle{font-size:16px;fill:#6b6179}.lane{font-size:12px;font-weight:700;letter-spacing:2px;fill:#70598e}.card{fill:white;stroke:#dcd4e8;stroke-width:1.6}.heading{font-size:21px;font-weight:700}.body{font-size:15px;fill:#62576f}.small{font-size:13px;fill:#62576f}.tag{font-size:11px;font-weight:700;letter-spacing:1px;fill:#6f44aa}.edge{fill:none;stroke:#75628f;stroke-width:2;marker-end:url(#arrow)}</style></defs>
<rect width="1440" height="1040" fill="#faf9fc"/>
<text x="56" y="62" class="title">FresherJobs AI</text><text x="56" y="91" class="subtitle">Scheduled collection and a separate read-only application for job seekers.</text>
<rect x="32" y="122" width="1376" height="468" rx="24" fill="#f0ebf8"/>
<text x="56" y="157" class="lane">01 / SCHEDULED INGESTION - AWS</text>
<rect x="430" y="180" width="310" height="77" rx="16" class="card"/><text x="452" y="214" class="heading">Amazon ECR</text><text x="452" y="242" class="body">Worker Docker image</text><path d="M585 257V290" class="edge" />
<rect x="56" y="291" width="280" height="105" rx="16" class="card"/><text x="78" y="325" class="heading">EventBridge Scheduler</text><text x="78" y="353" class="body">Daily - 03:00 IST*</text><text x="78" y="377" class="body">Asia/Kolkata - ECS RunTask</text><path d="M336 343H430" class="edge" />
<rect x="430" y="291" width="310" height="105" rx="16" class="card"/><text x="452" y="325" class="heading">ECS Fargate worker</text><text x="452" y="353" class="body">TypeScript - ATS adapters</text><text x="452" y="377" class="body">Idempotent upserts - source leases</text>
<rect x="1028" y="291" width="330" height="105" rx="16" class="card"/><text x="1050" y="325" class="heading">AWS Secrets Manager</text><text x="1050" y="353" class="body">Injects the MongoDB credential</text><text x="1050" y="377" class="body">Runtime credential via IAM role</text><path d="M1028 343H740" class="edge" />
<rect x="56" y="449" width="280" height="105" rx="16" class="card"/><text x="78" y="483" class="heading">Public ATS boards</text><text x="78" y="511" class="body">Greenhouse - Lever - Ashby</text><text x="78" y="535" class="body">Provider-specific public APIs</text><path d="M336 501H468V396" class="edge" /><text x="350" y="527" class="small">Postings</text>
<rect x="1028" y="462" width="330" height="155" rx="16" class="card"/><text x="1050" y="496" class="heading">MongoDB Atlas</text><text x="1050" y="524" class="body">companies - jobsources - jobs</text><text x="1050" y="548" class="body">Stable source/job identities</text><text x="1050" y="572" class="body">Descriptions + source metadata</text><text x="1050" y="596" class="body">Leases prevent overlapping writers</text>
<path d="M710 396V539H1028" class="edge" marker-start="url(#arrow)"/><text x="748" y="515" class="body">Read sources</text><text x="748" y="562" class="body">Upsert jobs + sync progress</text>
<rect x="32" y="648" width="1376" height="246" rx="24" fill="#eaf2ef"/>
<text x="56" y="683" class="lane">02 / JOB DISCOVERY - LIVE APPLICATION</text>
<rect x="56" y="720" width="300" height="126" rx="16" class="card"/><text x="78" y="744" class="tag">VERCEL</text><text x="78" y="773" class="heading">Next.js frontend</text><text x="78" y="800" class="body">Search - filters - job details</text><text x="78" y="824" class="body">Browser + server-side API client</text>
<rect x="655" y="720" width="320" height="126" rx="16" class="card"/><text x="677" y="744" class="tag">RENDER</text><text x="677" y="773" class="heading">Read-only NestJS API</text><text x="677" y="800" class="body">Validation - public-field mapping</text><text x="677" y="824" class="body">API key - rate limit - Helmet</text>
<path d="M356 785H655" class="edge" marker-start="url(#arrow)"/><text x="390" y="743" class="body">HTTPS + X-API-Key</text><text x="390" y="765" class="small">Fresh AES-GCM key per call</text><text x="390" y="815" class="small">RSA-OAEP wraps the AES key</text><text x="390" y="837" class="small">Encrypted queries and responses</text>
<path d="M975 785H1193V617" class="edge" marker-start="url(#arrow)"/><text x="1050" y="720" class="body">Read-only queries</text><text x="1050" y="743" class="small">No browser DB access</text>
<text x="56" y="934" class="body">LLM job role/city classification is not enabled. Current filters use stored provider fields.</text>
<text x="56" y="963" class="small">* AWS schedule configuration supplied by the project author; the first scheduled execution remains unverified.</text>
<text x="56" y="989" class="small">The RSA private key stays on Render. A browser API key identifies the public client; it is not user authentication.</text>
<path d="M740 315H840V218H1028" class="edge"/><rect x="1028" y="180" width="330" height="77" rx="16" class="card"/><text x="1050" y="214" class="heading">Amazon CloudWatch Logs</text><text x="1050" y="242" class="body">Task logs and run summaries</text></svg>